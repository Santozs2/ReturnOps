<title>Recupera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Recupera · "soft dashboard": black & white: framed app on a light-grey plane, black sidebar pill, white cards, one black hero; violet is reserved for things you can click.
     Light-first (opens light even on dark phones); an explicit dark choice in the viewer still applies. */
  :root {
    --bg: #E9E9E9;
    --frame: #F7F7F7;
    --surface: #FFFFFF;
    --surface-2: #F2F2F2;
    --ink: #0A0A0A;
    --muted: #6B6B6B;
    --line: #E4E4E4;
    --accent: #6A3DE8;
    --accent-2: #5228C9;
    --accent-soft: #F1ECFF;
    --accent-ink: #FFFFFF;
    --side-1: #1A1A1A;
    --side-2: #000000;
    --hero-1: #262626;
    --hero-2: #000000;
    --mono-tile: #111111;
    --ok: #15803D; --ok-soft: #E6F4EA;
    --warn: #A15C07; --warn-soft: #FDF3DF;
    --bad: #D42F45; --bad-soft: #FCE9EC;
    --info: #555555; --info-soft: #EFEFEF;
    --p-ml: #eda100; --p-sh: #eb6834; --p-tt: #1baf7a; --p-lj: #2a78d6;
    --scan: #0A0A0A; --scan-line: #9B7BFF;
    --shadow-sm: 0 10px 28px -18px rgba(0, 0, 0, .22);
    --shadow-lg: 0 26px 44px -26px rgba(0, 0, 0, .45);
    --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
    --f-display: "Plus Jakarta Sans", "Segoe UI", Roboto, Arial, sans-serif;
    --f-body: "Plus Jakarta Sans", "Segoe UI", Roboto, Arial, sans-serif;
    --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --frame: #0B0B0B; --surface: #151515; --surface-2: #1D1D1D; --ink: #F2F2F2; --muted: #A3A3A3; --line: #2A2A2A;
    --accent: #8B6AF5; --accent-2: #6C47E6; --accent-soft: #221A3D; --accent-ink: #FFFFFF; --side-1: #1C1C1C; --side-2: #0F0F0F;
    --hero-1: #2A2A2A; --hero-2: #121212; --mono-tile: #2A2A2A;
    --ok: #4ADE80; --ok-soft: #12301E; --warn: #F2B84B; --warn-soft: #33290F; --bad: #FF7A86; --bad-soft: #3A1A20; --info: #B5B5B5; --info-soft: #242424;
    --p-ml: #c98500; --p-sh: #d95926; --p-tt: #199e70; --p-lj: #3987e5;
    --shadow-sm: 0 10px 28px -16px rgba(0, 0, 0, .7); --shadow-lg: 0 26px 44px -24px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f-body); margin: 0; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.55rem, 3.4vw, 2rem); line-height: 1.15; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.06rem; line-height: 1.25; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  h3 { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.25; margin: 0; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .eyebrow { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 0 0 2px; }
  .muted { color: var(--muted); }
  .sub { display: block; color: var(--muted); font-size: .83rem; font-weight: 500; }
  .hint { font-size: .83rem; color: var(--muted); }
  .mono { font-family: var(--f-mono); font-size: .86em; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Demo strip */
  .demo-strip { display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--side-2); color: #fff; font-size: .76rem; padding: 5px 16px; white-space: nowrap; }
  .demo-strip span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .demo-strip button { flex: none; background: rgba(255, 255, 255, .16); border: 0; border-radius: 999px; padding: 2px 12px; cursor: pointer; color: inherit; font-size: .74rem; font-weight: 700; }

  /* Shell */
  .app { display: grid; grid-template-columns: 112px minmax(0, 1fr); margin: 16px; background: var(--frame); border-radius: 32px; min-height: calc(100vh - 60px); box-shadow: 0 40px 70px -40px rgba(0, 0, 0, .35); }
  .side { position: sticky; top: 16px; align-self: start; height: calc(100vh - 92px); min-height: 420px; margin: 16px 0 16px 16px; padding: 18px 8px; border-radius: 28px; background: linear-gradient(180deg, var(--side-1), var(--side-2)); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 20px 36px -18px rgba(0, 0, 0, .75); }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 800; font-size: .78rem; text-align: center; }
  .brand .ic { width: 46px; height: 46px; padding: 11px; border-radius: 15px; background: rgba(255, 255, 255, .18); color: #fff; }
  .brand small { display: none; }
  .side .sep { width: 44px; height: 1px; background: rgba(255, 255, 255, .22); flex: none; }
  .nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 6px 2px; border: 0; background: none; cursor: pointer; color: rgba(255, 255, 255, .75); font-size: .7rem; font-weight: 700; }
  .nav button .ic { width: 48px; height: 48px; padding: 13px; border-radius: 16px; transition: background .15s; }
  .nav button:hover { color: #fff; }
  .nav button:hover .ic { background: rgba(255, 255, 255, .12); }
  .nav button.on { color: #fff; }
  .nav button.on .ic { background: #fff; color: var(--side-2); box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .5); }
  .nav .badge { position: absolute; top: 2px; right: 14px; }
  .badge { font: 800 .66rem var(--f-body); background: var(--bad); color: #fff; border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center; box-shadow: 0 0 0 2px var(--side-2); }
  .badge.neutral { background: #fff; color: var(--side-2); }
  .side-foot { margin-top: auto; font-size: .66rem; opacity: .7; text-align: center; line-height: 1.3; }
  main { padding: 28px 28px 40px 22px; min-width: 0; }
  .view { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .mtop, .tabbar { display: none; }

  /* Generic */
  .page-h { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; justify-content: space-between; }
  .page-h > div { min-width: 0; }
  .card { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow-sm); }
  .card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 16px; font-weight: 700; cursor: pointer; min-height: 44px; text-align: center; transition: transform .12s, border-color .12s, color .12s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--accent-ink); box-shadow: 0 12px 22px -12px rgba(106, 61, 232, .85); }
  .btn-primary:hover { color: var(--accent-ink); border-color: transparent; transform: translateY(-1px); }
  .btn.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .65; cursor: progress; transform: none; }
  .btn-lg { min-height: 54px; font-size: 1.02rem; padding: 10px 22px; border-radius: 16px; }
  .w100 { width: 100%; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; font-size: .86rem; }
  .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .pill { display: inline-flex; align-items: center; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
  .pill-muted { background: var(--surface-2); color: var(--muted); }
  .pill-info { background: var(--info-soft); color: var(--info); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-accent { background: var(--ink); color: var(--surface); }
  .pill-ink { color: var(--ink); border-color: var(--ink); }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .plat { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; font-weight: 500; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .p-ml { background: var(--p-ml); } .p-sh { background: var(--p-sh); } .p-tt { background: var(--p-tt); } .p-lj { background: var(--p-lj); }
  input[type="search"], input[type="text"], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 14px; min-height: 46px; font-size: 1rem; }
  textarea { width: 100%; resize: vertical; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .segb { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
  .segb.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .tone-bad { background: var(--bad-soft); color: var(--bad); } .tone-warn { background: var(--warn-soft); color: var(--warn); } .tone-info { background: var(--info-soft); color: var(--info); } .tone-ok { background: var(--ok-soft); color: var(--ok); }
  .tlist { list-style: none; margin: 0; padding: 0; }
  .chev { color: var(--muted); font-size: 1.2rem; line-height: 1; }
  .allgood { display: flex; gap: 10px; align-items: center; color: var(--ok); font-weight: 700; }

  /* Guide (demo) */
  details.guide { border: 1.5px dashed var(--muted); background: var(--surface); border-radius: var(--r-md); }
  details.guide > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  details.guide > summary::-webkit-details-marker { display: none; }
  details.guide > summary::after { content: "Mostrar"; margin-left: auto; font-size: .82rem; font-weight: 700; color: var(--accent); }
  details.guide[open] > summary::after { content: "Esconder"; }
  .prog { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; flex: none; }
  .prog i { display: block; height: 100%; background: var(--ok); }
  .guide ol { margin: 0; padding: 0 16px 16px; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .gstep { width: 100%; height: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px; border: 0; border-radius: var(--r-sm); background: var(--surface-2); cursor: pointer; font-size: .86rem; }
  .gstep:hover { background: var(--accent-soft); }
  .gnum { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 700 .74rem var(--f-body); color: var(--muted); }
  .gstep.done { color: var(--muted); }
  .gstep.done .gnum { background: var(--ok); border-color: var(--ok); color: #fff; }

  /* ---------- Painel ---------- */
  .dash { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; max-width: 1440px; margin: 0 auto; }
  .dash-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dtitle { flex: 1 1 200px; min-width: 0; }
  .dsearch { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 16px; padding: 0 14px; min-height: 48px; box-shadow: var(--shadow-sm); flex: 0 1 300px; min-width: 0; }
  .dsearch .ic { color: var(--muted); }
  .dsearch input { border: 0; background: none; min-height: 46px; padding: 0; flex: 1; min-width: 0; outline: none; font-size: .95rem; }
  .dsearch:focus-within { outline: 2px solid var(--accent); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink); font-weight: 800; font-size: .85rem; box-shadow: 0 0 0 3px var(--surface), var(--shadow-sm); }
  .dbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .dfilters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dfilters .seg { background: var(--surface); border-radius: 14px; padding: 4px; box-shadow: var(--shadow-sm); }
  .dfilters .segb { border: 0; min-height: 36px; padding: 6px 14px; border-radius: 10px; }
  .dfilters select { min-height: 44px; border: 0; border-radius: 14px; box-shadow: var(--shadow-sm); font-size: .92rem; font-weight: 600; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

  .hero-row { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; }
  .hero { position: relative; border-radius: 28px; padding: 22px 22px 18px; color: #fff; background: radial-gradient(130% 140% at 0% 0%, var(--hero-1) 0%, var(--hero-2) 70%); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 10px; overflow: hidden; min-width: 0; }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .06); pointer-events: none; }
  .hero::before { width: 260px; height: 260px; right: -90px; top: -120px; }
  .hero::after { width: 200px; height: 200px; left: -70px; bottom: -110px; }
  .hero > * { position: relative; z-index: 1; }
  .hero-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hero-h h2 { font-size: 1.2rem; }
  .hero-sub { display: block; font-size: .8rem; opacity: .78; font-weight: 500; }
  .hero-ctl { display: flex; gap: 6px; align-items: center; }
  .hsel, .hbtn { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); color: #fff; border-radius: 999px; min-height: 38px; padding: 4px 14px; font-size: .84rem; font-weight: 700; cursor: pointer; }
  .hsel option { color: #0A0A0A; }
  .hbtn:hover, .hsel:hover { background: rgba(255, 255, 255, .22); }
  .hchart { position: relative; min-height: 210px; }
  .hchart svg { display: block; max-width: 100%; overflow: visible; }
  .hchart .hgl { stroke: rgba(255, 255, 255, .12); stroke-width: 1; }
  .hchart .harea { fill: url(#hfill); }
  .hchart .hline { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .hchart .hband { fill: rgba(255, 255, 255, .12); }
  .hchart .hdot { fill: #fff; stroke: var(--hero-2); stroke-width: 3; }
  .hchart .hdot-halo { fill: rgba(255, 255, 255, .25); }
  .hchart .hx { fill: rgba(255, 255, 255, .72); font: 600 11.5px var(--f-body); }
  .hchart .hx.on { fill: #0A0A0A; font-weight: 800; }
  .hchart .hxpill { fill: #fff; }
  .hchart .hhit { fill: transparent; cursor: pointer; outline: none; }
  .hchart .hhit:focus-visible { stroke: #fff; stroke-width: 2; }
  .htip { position: absolute; pointer-events: none; background: rgba(0, 0, 0, .55); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, .22); border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap; }
  .htip b { font-size: 1.05rem; font-weight: 800; }
  .htip span { font-size: .74rem; opacity: .85; }
  .hstats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px; align-items: end; }
  .hs { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 12px 6px; border-radius: 20px; min-width: 0; }
  .hs span { font-size: .78rem; opacity: .82; font-weight: 600; }
  .hs b { font-family: var(--f-display); font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; line-height: 1.2; }
  .hs small { font-size: .74rem; opacity: .86; font-weight: 500; }
  .hs-main { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .24); padding: 16px 8px; box-shadow: 0 18px 30px -20px rgba(0, 0, 0, .55); }
  .hs-main b { font-size: 1.75rem; }
  .htbl { background: rgba(255, 255, 255, .08); border-radius: 16px; padding: 4px 10px; }
  .htbl th { color: rgba(255, 255, 255, .75) !important; }
  .htbl td, .htbl th { border-color: rgba(255, 255, 255, .16) !important; }

  .quick { display: flex; flex-direction: column; gap: 20px; }
  .qcard { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 6px; padding: 18px; border: 0; border-radius: var(--r-lg); color: #fff; text-align: left; cursor: pointer; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); transition: transform .15s; min-height: 150px; }
  .qcard:hover { transform: translateY(-2px); }
  .qcard::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, .1); }
  .q-sky { background: linear-gradient(140deg, var(--accent) 0%, var(--accent-2) 100%); }
  .q-risk { background: linear-gradient(140deg, #EC5468 0%, #C42645 100%); }
  .q-ok { background: linear-gradient(140deg, #1E9E66 0%, #12744A 100%); cursor: default; }
  .q-ok:hover { transform: none; }
  .q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .q-ic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .3); flex: none; }
  .q-ic .ic { width: 22px; height: 22px; }
  .q-t { font-weight: 800; font-size: 1rem; line-height: 1.2; }
  .q-v { font-family: var(--f-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.1; }
  .q-s { font-size: .8rem; opacity: .92; font-weight: 500; max-width: 80%; }
  .q-go { position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .85); display: grid; place-items: center; z-index: 1; }
  .q-go .ic { width: 16px; height: 16px; }

  .tcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; padding-top: 28px; }
  .tcard { position: relative; background: var(--surface); border-radius: var(--r-lg); padding: 42px 18px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); min-width: 0; }
  .tc-ic { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #fff; box-shadow: 0 14px 22px -12px rgba(0, 0, 0, .65); }
  .tc-ic .ic { width: 25px; height: 25px; }
  .tc-bad { background: var(--mono-tile); }
  .tc-warn { background: var(--mono-tile); }
  .tc-info { background: var(--mono-tile); }
  .tc-ok { background: var(--mono-tile); }
  .tc-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; background: none; border: 0; cursor: pointer; padding: 0; }
  .tc-head:hover h3 { color: var(--accent); }
  .tc-prog { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; font-weight: 800; margin-top: 4px; }
  .tc-prog span { color: var(--muted); font-weight: 600; }
  .pbar { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .pbar i.b-bad { background: var(--bad); } .pbar i.b-warn { background: #E59A1A; }
  .tc-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; cursor: pointer; text-align: left; font-size: .82rem; font-weight: 600; min-height: 42px; margin-top: 2px; }
  .tc-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-item:hover { background: var(--accent-soft); }
  .tc-empty { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ok); font-weight: 700; font-size: .86rem; padding: 10px 0 4px; }

  .flow2 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .flow2 li { position: relative; min-width: 0; }
  .flow2 li + li::before { content: "›"; position: absolute; left: -11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 800; }

  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

  .ftime { display: block; font-size: .72rem; color: var(--muted); opacity: .85; }

  .mbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }

  .insight { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); font-size: .84rem; }

  .tbl { overflow-x: auto; }

  /* ---------- Lista ---------- */

  .chip-n { font-size: .74rem; opacity: .75; margin-left: 2px; font-weight: 800; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-row input { flex: 1 1 240px; min-width: 0; }
  .filter-row select { flex: 0 1 220px; min-width: 0; }
  .rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); padding: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 240px 110px; gap: 14px; align-items: center; padding: 12px 14px; background: none; border: 0; border-radius: 16px; text-align: left; cursor: pointer; width: 100%; }
  .row + .row { margin-top: 2px; }
  .row:hover { background: var(--surface-2); }
  .r-main { min-width: 0; } .r-main b { font-weight: 700; }
  .r-st { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
  .r-next { font-size: .8rem; color: var(--muted); }
  .r-next.t-bad { color: var(--bad); font-weight: 700; } .r-next.t-warn { color: var(--warn); font-weight: 700; }
  .r-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .new { display: inline-block; margin-left: 6px; font: 800 .64rem var(--f-body); text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: var(--surface); padding: 2px 7px; border-radius: 999px; vertical-align: 2px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  /* ---------- Ficha ---------- */
  .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; font-weight: 700; align-self: flex-start; min-height: 36px; }
  .back:hover { color: var(--accent); }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .9rem; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .steps li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; padding: 0 2px; }
  .steps li::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 3px; border-radius: 3px; background: var(--line); z-index: 0; }
  .steps li:first-child::before { display: none; }
  .steps li.st-done::before, .steps li.st-cur::before, .steps li.st-skip::before { background: var(--ink); }
  .sc { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 800 .8rem var(--f-body); background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
  .sc .ic { width: 16px; height: 16px; }
  .st-done .sc { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .st-cur .sc { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 5px var(--surface-2); }
  .st-bad .sc { background: var(--bad); border-color: var(--bad); color: #fff; }
  .st-skip .sc { border-style: dashed; border-color: var(--ink); color: var(--ink); }
  .sl { font-size: .82rem; font-weight: 700; line-height: 1.2; }
  .st-todo .sl { color: var(--muted); font-weight: 500; }
  .st-cur .sl { color: var(--ink); font-weight: 800; }
  .sd { font-size: .72rem; color: var(--muted); }
  .next { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-sm); border: 1.5px solid transparent; }
  .next-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; }
  .next-h > div { min-width: 0; flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; }
  .next-h p.muted { font-size: .92rem; }
  .next-accent { background: var(--surface); border-color: var(--ink); }
  .next-bad { background: var(--bad-soft); border-color: var(--bad); }
  .next-warn { background: var(--warn-soft); border-color: #E59A1A; }
  .next-ok { background: var(--ok-soft); border-color: var(--ok); }
  .dsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: ds; }
  .dsteps > li { counter-increment: ds; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .dsteps > li::before { content: counter(ds); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 .8rem var(--f-body); background: var(--ink); color: var(--surface); }
  .dsteps > li.wide { grid-template-columns: 28px minmax(0, 1fr); }
  .dsteps > li.wide .inrow { grid-column: 2; }
  .dsteps b { font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .vols { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .vols li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .9rem; }
  .vbox { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; font: 800 .74rem var(--f-body); border: 1.5px dashed var(--muted); color: var(--muted); }
  .vbox.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: .9rem; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; min-width: 0; font-weight: 600; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { position: relative; padding: 0 0 14px 24px; font-size: .9rem; }
  .tl li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
  .tl li::after { content: ""; position: absolute; left: 8px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
  .tl li:last-child::after { display: none; }
  .tl li:first-child::before { border-color: var(--ink); background: var(--ink); }
  .tl .when { display: block; font-size: .78rem; color: var(--muted); }

  /* Photos + choices */
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .ph { position: relative; margin: 0; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph figcaption { position: absolute; left: 6px; top: 6px; font: 700 .68rem var(--f-body); background: rgba(0, 0, 0, .62); color: #fff; padding: 1px 7px; border-radius: 999px; }
  .ph-x { position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .62); color: #fff; cursor: pointer; font-size: 17px; line-height: 1; }
  .addph { aspect-ratio: 4 / 3; max-width: 100%; border: 1.5px dashed var(--muted); border-radius: var(--r-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; background: none; color: var(--ink); font-weight: 700; font-size: .85rem; text-align: center; padding: 6px; position: relative; }
  .addph.main { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .addph:hover, .addph:focus-within { border-color: var(--accent); color: var(--accent); }

  .big2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bigc { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 12px; border: 2px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer; font-weight: 800; font-size: 1rem; text-align: center; }
  .bigc .ic { width: 30px; height: 30px; }
  .bigc small { font-weight: 500; color: var(--muted); font-size: .8rem; }
  .bigc.ok .ic { color: var(--ok); } .bigc.bad .ic { color: var(--bad); }
  .bigc:hover { border-color: var(--accent); }
  .bigc.ok.on { border-color: var(--ok); background: var(--ok-soft); }
  .bigc.bad.on { border-color: var(--bad); background: var(--bad-soft); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
  .choice span { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 999px; font-weight: 700; font-size: .9rem; background: var(--surface); }
  .choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .qnum { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 800 .76rem var(--f-body); margin-right: 8px; vertical-align: 1px; }
  .err { color: var(--bad); font-weight: 700; }
  .sticky-actions { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(to bottom, transparent, var(--frame) 35%); z-index: 5; }
  .inrow { display: flex; gap: 8px; }
  .inrow input { flex: 1; min-width: 0; }
  .inrow.code input { font-family: var(--f-mono); letter-spacing: .04em; }

  /* ---------- Receber ---------- */
  .recv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .recv-main, .recv-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .viewfinder { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: radial-gradient(120% 120% at 0% 0%, #2A2A2A, var(--scan)); border-radius: var(--r-md); overflow: hidden; display: grid; place-items: center; }
  .vf-label { width: 44%; aspect-ratio: 2.2 / 1; background: #EDEDE8; border-radius: 4px; padding: 6% 7%; display: flex; flex-direction: column; gap: 6%; opacity: .45; transform: rotate(-3deg); }
  .vf-bars { flex: 1; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 5px, transparent 5px 8px, #111 8px 11px, transparent 11px 12px); }
  .vf-num { height: 12%; background: repeating-linear-gradient(90deg, #555 0 5px, transparent 5px 7px); }
  .scanning .vf-label { opacity: .95; }
  .vf-frame { position: absolute; inset: 14% 18%; border: 2px solid rgba(255, 255, 255, .25); border-radius: 12px; }
  .vf-line { position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; background: var(--scan-line); box-shadow: 0 0 14px var(--scan-line); opacity: .35; }
  .scanning .vf-line { opacity: 1; animation: sweep 1s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 18%; } to { top: 82%; } }
  .vf-txt { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, .78); font: 600 .74rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; }
  .lbl { font-size: .88rem; font-weight: 700; display: block; margin-bottom: 6px; }
  .result { border-radius: var(--r-lg); padding: 18px; border: 2px solid; display: flex; flex-direction: column; gap: 6px; animation: pop .25s ease-out; box-shadow: var(--shadow-sm); }
  @keyframes pop { from { transform: scale(.985); } to { transform: none; } }
  .res-ok { background: var(--ok-soft); border-color: var(--ok); }
  .res-warn { background: var(--warn-soft); border-color: #E59A1A; }
  .res-bad { background: var(--bad-soft); border-color: var(--bad); }
  .res-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 1.05rem; }
  .res-ok .res-h { color: var(--ok); } .res-warn .res-h { color: var(--warn); } .res-bad .res-h { color: var(--bad); }
  .res-h .mono { margin-left: auto; color: var(--muted); font-weight: 500; font-size: .8rem; }
  .res-h .ic { width: 24px; height: 24px; }
  .res-prod { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; }
  .res-vol { font-weight: 700; }
  .res-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  details.tests > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  details.tests > summary::-webkit-details-marker { display: none; }
  details.tests > summary::after { content: "+"; color: var(--muted); font-weight: 800; }
  details.tests[open] > summary::after { content: "–"; }
  .codes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .code-b { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 0; border-radius: var(--r-sm); background: var(--surface-2); padding: 9px 12px; cursor: pointer; text-align: left; width: 100%; min-height: 44px; }
  .code-b:hover { background: var(--accent-soft); }
  .code-b .mono { font-weight: 600; }
  .code-b small { color: var(--muted); font-size: .78rem; text-align: right; min-width: 0; }
  .today { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
  .today li { display: flex; justify-content: space-between; gap: 10px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--side-2); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: .9rem; font-weight: 600; width: max-content; max-width: calc(100% - 32px); z-index: 30; box-shadow: var(--shadow-lg); }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg); } }


  /* ---------- Início (decluttered) ---------- */
  .home { max-width: 1040px; }

  .spark .a { fill: rgba(255, 255, 255, .14); }
  .hs-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .88rem; margin-top: auto; padding-top: 10px; }

  .tc-head { cursor: default; }
  .tc-more { align-self: center; }
  .view.narrow { max-width: 820px; }
  .ftabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; overflow-x: auto; }

    function vFicha() {

    /* ---------- Conferência (inspeção) ---------- */
    function photosEdit() {
      var d = S.draft;
      return d.fotos.map(function (f, i) {
        return '<figure class="ph"><img src="' + fotoSrc(f) + '" alt="Foto ' + (i + 1) + ', volume ' + f.vol + '"><figcaption>Vol ' + f.vol + '</figcaption><button type="button" class="ph-x" data-act="rmFoto" data-i="' + i + '" aria-label="Remover foto ' + (i + 1) + '">×</button></figure>';
      }).join('') +
        '<label class="addph main" for="fileIn"><input type="file" id="fileIn" class="vh" accept="image/*" capture="environment" multiple>' + icon('camera') + '<span>Tirar foto</span></label>' +
        '<button type="button" class="addph" data-act="exFoto">' + icon('image') + '<span>Usar foto de exemplo</span></button>';

        html += '<section class="card"><h2><span class="qnum">' + (++q) + '</span>Qual volume você está conferindo?</h2><div class="seg">' + rec.map(function (v) {
          return '<button type="button" class="segb' + (d.vol === v.n ? ' on' : '') + '" data-act="vol" data-n="' + v.n + '" aria-pressed="' + (d.vol === v.n) + '">Volume ' + v.n + ' de ' + r.volumes.length + '</button>';
        }).join('') + '</div>' + (rec.length < r.volumes.length ? '<p class="hint">Os volumes que ainda não chegaram são conferidos depois.</p>' : '') + '</section>';
      }

        '<button type="button" class="bigc ok' + (d.estado === 'ok' ? ' on' : '') + '" data-act="estado" data-e="ok" aria-pressed="' + (d.estado === 'ok') + '">' + icon('checkc') + 'Em bom estado<small>Volta para o estoque</small></button>' +
        '<button type="button" class="bigc bad' + (d.estado === 'problema' ? ' on' : '') + '" data-act="estado" data-e="problema" aria-pressed="' + (d.estado === 'problema') + '">' + icon('warn') + 'Com problema<small>Vai para disputa</small></button></div>';
      if (d.estado === 'problema') {
        html += '<p class="lbl" style="margin:4px 0 0">Qual é o problema?</p><div class="choices" role="radiogroup" aria-label="Qual é o problema">' + PROBLEMAS.map(function (k) {
          return '<label class="choice"><input type="radio" name="cond" value="' + k + '"' + (d.cond === k ? ' checked' : '') + '><span>' + COND[k] + '</span></label>';
        }).join('') + '</div>';
      }
      html += '</section>';
      var need = d.estado === 'problema';
      html += '<section class="card"><div class="card-h"><h2><span class="qnum">' + (++q) + '</span>Fotos' + (need ? '' : ' <span class="muted" style="font-weight:500">(opcional)</span>') + '</h2><span class="muted" id="phCount">' + plural(d.fotos.length, 'foto', 'fotos') + '</span></div>' +
        (need ? '<p class="hint">Fotografe o defeito de perto e o produto inteiro. Quanto mais fotos, mais chance de ganhar a disputa.</p>' : '') +
        '<div class="photos" id="photos">' + photosEdit() + '</div></section>';
      html += '<section class="card"><h2><label for="obs"><span class="qnum">' + (++q) + '</span>Observação <span class="muted" style="font-weight:500">(opcional)</span></label></h2><textarea id="obs" rows="3" placeholder="Ex.: porta rachada, quina quebrada">' + esc(d.obs) + '</textarea></section>';
      html += '<p class="err" id="inspErr" role="alert" hidden></p>';
      html += '<div class="sticky-actions"><button type="button" class="btn btn-primary btn-lg w100" data-act="saveInsp">' + icon('check') + ' Salvar conferência</button></div>';
      return html + '</div>';
    }
    function refreshPhotos() { $('#photos').innerHTML = photosEdit(); $('#phCount').textContent = plural(S.draft.fotos.length, 'foto', 'fotos'); var e = $('#inspErr'); if (e) e.hidden = true; }
    function startInsp(id, vol) {
      var r = byId(id); if (!r) return;
      var rec = r.volumes.filter(function (v) { return v.recebidoEm; });
      S.draft = {
        id: id, estado: r.condicao ? (r.condicao === 'ok' ? 'ok' : 'problema') : null, cond: r.condicao && r.condicao !== 'ok' ? r.condicao : null, obs: r.obs, fotos: r.fotos.slice(),
        vol: vol || (rec.length ? rec[rec.length - 1].n : 1), from: S.view

    function saveInsp() {
      var d = S.draft, r = byId(d.id), err = $('#inspErr');
      var fail = function (m) { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: 'center' }); };
      if (!d.estado) return fail('Escolha como o produto chegou: em bom estado ou com problema.');
      if (d.estado === 'problema' && !d.cond) return fail('Escolha qual é o problema.');
      if (d.estado === 'problema' && !d.fotos.length) return fail('Tire pelo menos 1 foto. Ela é a prova da disputa.');
      r.condicao = d.estado === 'ok' ? 'ok' : d.cond; r.obs = d.obs.trim(); r.fotos = d.fotos.slice(); r.inspecionadaEm = Date.now();
      r.timeline.push({ t: Date.now(), txt: 'Conferido: ' + COND[r.condicao] + (r.fotos.length ? ' · ' + plural(r.fotos.length, 'foto', 'fotos') : ''), por: VOCE });
      var from = d.from; S.draft = null;
      if (from === 'receber') { S.scan = null; go('receber'); toast('Conferência salva. Pode bipar o próximo pacote.'); }

    /* ---------- Receber ---------- */
    var CAM_ORDER = ['DV-1052', 'DV-1049', 'DV-1050', 'DV-1051', 'DV-1047'];
    function pendingVols() {
      var out = [];
      DB.forEach(function (r) {
        var k = status(r).k;
        if (k !== 'aguardando' && k !== 'parcial') return;
        r.volumes.forEach(function (v) { if (!v.recebidoEm) out.push({ r: r, v: v }); });
      });
      out.sort(function (a, b) {
        var ia = CAM_ORDER.indexOf(a.r.id), ib = CAM_ORDER.indexOf(b.r.id);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.v.n - b.v.n;
      });
      return out;
    }

        '<p class="res-vol">Volume ' + v.n + ' de ' + n + (faltam ? ' · ' + (faltam === 1 ? 'ainda falta 1 volume' : 'ainda faltam ' + faltam + ' volumes') : ' · todos os volumes chegaram') + '</p>' +
        '<div class="res-btns"><button type="button" class="btn btn-primary btn-lg" data-act="gotoInsp" data-id="' + r.id + '" data-vol="' + v.n + '">' + icon('camera') + ' Conferir e fotografar agora</button><button type="button" class="btn btn-lg" data-act="nextScan">' + icon('scan') + ' Bipar outro pacote</button></div></div>';
    }
    function vReceber() {
      var pend = pendingVols();
      var tests = pend.slice(0, 5).map(function (x) { return [x.v.codigo, x.r.produto + ' · vol ' + x.v.n + '/' + x.r.volumes.length]; });
      var dupR = DB.filter(function (r) { return status(r).k === 'recebida'; })[0];
      if (dupR) tests.push([dupR.volumes[0].codigo, 'já recebido']);
      var recR = byId('DV-1035'); if (recR && !recR.volumes[0].recebidoEm) tests.push([recR.volumes[0].codigo, 'devolução recusada']);
      tests.push(['BR26999901', 'código desconhecido']);
      var hoje = [];
      DB.forEach(function (r) { r.volumes.forEach(function (v) { if (v.recebidoEm && daysSince(v.recebidoEm) === 0) hoje.push({ r: r, v: v }); }); });
      hoje.sort(function (a, b) { return b.v.recebidoEm - a.v.recebidoEm; });

      var html = '<div class="view"><div class="page-h"><div><h1>Receber pacote</h1><p class="muted" style="margin-top:4px">Chegou uma devolução? Leia a etiqueta para registrar a chegada.</p></div></div>';

      html += '<form id="scanForm" autocomplete="off"><label class="lbl" for="scanIn">Ou use o leitor de código de barras / digite o código</label><div class="inrow code"><input type="text" id="scanIn" placeholder="BR26…" autocapitalize="characters" spellcheck="false"><button class="btn" type="submit">Registrar</button></div></form>';
      html += '</section></div><aside class="recv-side">';

        return '<li><span>' + esc(x.r.produto) + ' <span class="muted">· vol ' + x.v.n + '/' + x.r.volumes.length + '</span></span><span class="muted">' + hhmm(x.v.recebidoEm) + '</span></li>';
      }).join('') + '</ul>' : '<p class="muted">Nenhum pacote recebido hoje ainda.</p>') + '</section>';
      html += '<section class="card"><details class="tests"' + (wide() ? ' open' : '') + '><summary>Códigos para testar a demonstração</summary><div class="codes">' + tests.map(function (t) {
        return '<button type="button" class="code-b" data-act="test" data-code="' + t[0] + '"><span class="mono">' + t[0] + '</span><small>' + esc(t[1]) + '</small></button>';
      }).join('') + '</div></details></section>';
      html += '</aside></div></div>';
      return html;
    }
    function receber(r, v) {
      v.recebidoEm = Date.now(); v.por = VOCE;
      r.timeline.push({ t: Date.now(), txt: 'Volume ' + v.n + ' de ' + r.volumes.length + ' chegou (bipado)', por: VOCE });
      S.done.scan = true;
    }
    function processCode(code) {
      code = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!code) return;
      var hit = null;
      DB.forEach(function (r) { r.volumes.forEach(function (v) { if (v.codigo === code) hit = { r: r, v: v }; }); });
      if (!hit) { S.scan = { tipo: 'nf', codigo: code }; beep(false); }
      else if (hit.v.recebidoEm) { S.scan = { tipo: 'dup', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(false); }
      else if (hit.r.statusPlat !== 'aprovada') { S.scan = { tipo: 'confirm', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(false); }
      else { receber(hit.r, hit.v); S.scan = { tipo: 'ok', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(true); }
      render(); window.scrollTo(0, 0);
    }
    function camSim() {
      var p = pendingVols();
      if (!p.length) { toast('Não há pacotes a caminho.'); return; }
      S.scanning = true; S.scan = null; render();
      setTimeout(function () { S.scanning = false; processCode(p[0].v.codigo); }, 1300);
    }

    /* ---------- sound + toast ---------- */
    var actx = null;
    function beep(ok) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = ok ? 1760 : 220; g.gain.value = 0.04;
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.3));
      } catch (e) { /* som opcional */ }
    }
    var tTimer;
    function toast(m) { var el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(tTimer); tTimer = setTimeout(function () { el.hidden = true; }, 3800); }

    /* ---------- sync ---------- */
    function doSync() {
      if (S.syncing) return;
      S.syncing = true; if (S.view !== 'painel') go('painel'); else render();
      setTimeout(function () {
        S.syncing = false; var msg;
        if (!S.synced) {
          newOnes().forEach(function (o) { DB.push(build(o)); });
          var r = byId('DV-1053');
          if (r && r.statusPlat === 'analise') { r.statusPlat = 'aprovada'; r.aprovadaEm = Date.now(); r.novo = true; r.timeline.push({ t: Date.now(), txt: 'Aprovada pela plataforma', por: PLATF }); }
          S.synced = true; msg = 'Pronto: 3 devoluções novas e 1 aprovada desde ontem.';
        } else msg = 'Tudo em dia. Nenhuma novidade nas plataformas.';
        S.lastSync = Date.now(); S.done.sync = true; render(); toast(msg);
      }, 1500);
    }

    /* ---------- render + routing ---------- */
    var root = 'painel';
    function render() {
      var v = S.view, m = $('#main');
      m.innerHTML = v === 'painel' ? vPainel() : v === 'resultados' ? vResultados() : v === 'lista' ? vLista() : v === 'receber' ? vReceber() : v === 'ficha' ? vFicha() : vInsp();
      if (v === 'resultados' && !S.chartTable) drawChart();
      var hp = $('#help'); hp.hidden = !S.helpOpen; if (S.helpOpen) hp.innerHTML = helpHtml();
      var navKey = root;
      document.querySelectorAll('[data-nav]').forEach(function (b) { var on = b.dataset.nav === navKey; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
      var nT = nTasks(), nPend = pendingVols().length;
      document.querySelectorAll('[data-badge="painel"]').forEach(function (b) { b.textContent = nT; b.hidden = !nT; });
      document.querySelectorAll('[data-badge="receber"]').forEach(function (b) { b.textContent = nPend; b.hidden = !nPend; });
      if (v === 'receber' && !S.scanning && !S.scan && window.matchMedia && matchMedia('(pointer: fine)').matches) { var i = $('#scanIn'); if (i) i.focus({ preventScroll: true }); }
    }
    function go(v) {
      if (v === 'painel' || v === 'resultados' || v === 'lista' || v === 'receber') root = v;
      S.view = v; S.form = null; S.txtFallback = null; render(); window.scrollTo(0, 0);
    }
    function goBack() {
      S.view = root; S.form = null; S.txtFallback = null; render(); window.scrollTo(0, 0);
    }
    function openFicha(id) { S.ftab = null; S.id = id; S.done.ficha = true; var r = byId(id); if (r) r.novo = false; go('ficha'); }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var a = b.dataset.act, id = b.dataset.id, r, g;
      switch (a) {
        case 'nav': if (b.dataset.v === 'receber' && S.view !== 'receber') S.scan = null; if (b.dataset.v === 'lista') { S.filtro = 'acao'; S.plat = ''; S.q = ''; } go(b.dataset.v); break;
        case 'back': goBack(); break;
        case 'help': S.helpOpen = !S.helpOpen; render(); break;
        case 'ftab': S.ftab = b.dataset.t; render(); var ftb = document.querySelector('[data-act="ftab"][data-t="' + S.ftab + '"]'); if (ftb) ftb.focus(); break;
        case 'open': openFicha(id); break;
        case 'filter': S.filtro = b.dataset.f; S.q = ''; S.plat = S.view === 'resultados' ? S.dplat : ''; if (S.view === 'lista') render(); else go('lista'); break;
        case 'sync': doSync(); break;
        case 'per': S.per = +b.dataset.p; S.hi = null; render(); break;
        case 'rtab': S.rtab = b.dataset.t; render(); var rt = document.querySelector('[data-act="rtab"][data-t="' + S.rtab + '"]'); if (rt) rt.focus(); break;
        case 'ttab': S.ttab = b.dataset.t; render(); var tb = document.querySelector('.ttab[data-t="' + S.ttab + '"]'); if (tb) tb.focus(); break;
        case 'chartTable': S.chartTable = !S.chartTable; render(); break;
        case 'reset': reset(); go('painel'); toast('Demonstração reiniciada.'); break;
        case 'g1': S.helpOpen = false; doSync(); break;
        case 'g2': S.helpOpen = false; g = tasks(); r = g.disputa[0] || g.conferir[0] || DB[0]; openFicha(r.id); break;
        case 'g3': S.helpOpen = false; S.scan = null; go('receber'); break;
        case 'g4': S.helpOpen = false; g = tasks(); r = g.disputa[0]; if (r) openFicha(r.id); else toast('Nenhuma devolução pronta para disputa agora.'); break;
        case 'camSim': camSim(); break;
        case 'test': processCode(b.dataset.code); break;
        case 'forceRecv': r = byId(S.scan.id); receber(r, r.volumes[S.scan.vol - 1]); S.scan.tipo = 'ok'; beep(true); render(); break;
        case 'nextScan': S.scan = null; render(); window.scrollTo(0, 0); var si = $('#scanIn'); if (si && matchMedia('(pointer: fine)').matches) si.focus(); break;
        case 'naoId': S.naoId.push({ codigo: S.scan.codigo, em: Date.now() }); S.scan = null; render(); toast('Pacote registrado. Ele aparece no painel para a gestão vincular.'); break;
        case 'gotoInsp': startInsp(id, b.dataset.vol ? +b.dataset.vol : null); break;
        case 'cancelInsp': var from = S.draft && S.draft.from; S.draft = null; if (from === 'receber') go('receber'); else { S.view = 'ficha'; render(); window.scrollTo(0, 0); } break;
        case 'vol': S.draft.vol = +b.dataset.n; render(); break;
        case 'estado': S.draft.estado = b.dataset.e; if (b.dataset.e === 'ok') S.draft.cond = null; render(); var er = $('#inspErr'); if (er) er.hidden = true; break;
        case 'exFoto': S.draft.fotos.push({ ex: true, seed: Math.floor(Math.random() * 1e6), vol: S.draft.vol }); refreshPhotos(); break;
        case 'rmFoto': S.draft.fotos.splice(+b.dataset.i, 1); refreshPhotos(); break;
        case 'saveInsp': saveInsp(); break;
        case 'res': S.form = S.form === b.dataset.r ? null : b.dataset.r; render(); var fi = document.querySelector('#resForm input'); if (fi) fi.focus(); break;
        case 'estoque':
          r = byId(id); r.estoque = true; r.encerradaEm = Date.now();
          r.timeline.push({ t: Date.now(), txt: 'Voltou ao estoque · devolução encerrada', por: VOCE }); render(); toast('Devolução encerrada. Produto de volta ao estoque.'); break;
        case 'zip':
          r = byId(id); toast('No sistema de verdade, baixa as ' + r.fotos.length + ' fotos de uma vez (' + r.id + '-fotos.zip).'); break;
        case 'copyTxt':
          r = byId(id);
          var txt = dispText(r);
          var fail = function () { S.txtFallback = id; render(); var t = $('#txtFb'); if (t) { t.focus(); t.select(); } toast('Selecione e copie o texto que apareceu.'); };
          try { navigator.clipboard.writeText(txt).then(function () { toast('Texto copiado. É só colar no site da plataforma.'); }, fail); } catch (err) { fail(); }
          break;
      }
    });

    document.addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, r;
      if (f.id === 'dsearch') { S.q = $('#dsq').value.trim(); S.filtro = 'todas'; S.plat = S.dplat; go('lista'); return; }
      if (f.id === 'scanForm') { var i = $('#scanIn'); var c = i.value; i.value = ''; processCode(c); }
      else if (f.id === 'pedForm') {
        var q = $('#pedIn').value.trim().replace('#', '');
        var hit = q && DB.filter(function (x) { return x.pedido.replace('#', '').indexOf(q) >= 0; })[0];
        if (hit) { S.scan = null; openFicha(hit.id); } else toast('Nenhum pedido encontrado com esse número.');
      }
      else if (f.id === 'dispForm') {
        r = byId(S.id);
        var inp = $('#fProt'), prot = inp.value.trim();
        if (!prot) { inp.focus(); toast('Digite o número do protocolo que a plataforma mostrou.'); return; }
        r.disputa = { abertaEm: Date.now(), protocolo: prot, valor: r.valor, resultado: null, valorRecebido: 0, motivoPerda: '', fechadaEm: null };
        r.timeline.push({ t: Date.now(), txt: 'Disputa aberta · protocolo ' + prot, por: VOCE });
        S.form = null; S.txtFallback = null; S.done.disp = true; render(); window.scrollTo(0, 0); toast('Disputa registrada. Agora é aguardar a resposta da plataforma.');
      }
      else if (f.id === 'resForm') {
        r = byId(S.id);
        var res = f.dataset.r, D = r.disputa;
        D.resultado = res; D.fechadaEm = Date.now();
        if (res === 'ganha') { D.valorRecebido = parseValor($('#fRec').value) || D.valor; r.timeline.push({ t: Date.now(), txt: 'Disputa ganha · reembolso de ' + money(D.valorRecebido), por: VOCE }); }
        else { D.motivoPerda = $('#fMot').value.trim() || 'Motivo não informado'; r.timeline.push({ t: Date.now(), txt: 'Disputa perdida · ' + D.motivoPerda, por: VOCE }); }
        S.form = null; render(); toast(res === 'ganha' ? 'Reembolso registrado.' : 'Resultado registrado.');
      }
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.id === 'q') { S.q = t.value; $('#rows').innerHTML = rowsHtml(); }
      else if (t.id === 'obs' && S.draft) S.draft.obs = t.value;
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'dplat') { S.dplat = t.value; S.hi = null; render(); return; }
      if (t.id === 'hmetric') { S.hmetric = t.value; render(); return; }
      if (t.id === 'pf') { S.plat = t.value; $('#rows').innerHTML = rowsHtml(); }
      else if (t.name === 'cond' && S.draft) { S.draft.cond = t.value; var er = $('#inspErr'); if (er) er.hidden = true; }
      else if (t.id === 'fileIn' && S.draft) {
        Array.prototype.forEach.call(t.files || [], function (file) { S.draft.fotos.push({ src: URL.createObjectURL(file), vol: S.draft.vol }); });
        refreshPhotos();
      }
    });
    document.addEventListener('toggle', function (e) { if (e.target.id === 'guide') S.guideOpen = e.target.open; }, true);

    var rzT;
    window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(function () { if (S.view === 'resultados' && !S.chartTable) drawChart(); }, 150); });

    document.querySelectorAll('[data-ic]').forEach(function (el) { el.insertAdjacentHTML('afterbegin', icon(el.dataset.ic)); });
    reset();
    render();
  })();
</script>
