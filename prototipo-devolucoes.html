<title>Recupera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Recupera. Layout: app shell (sidebar on desktop, bottom tab bar with a raised "Receber" on phone); one vocabulary of stages shared by stepper, tiles, chips and pills */
  /* Light-first: opens light even on dark phones (bright warehouse/office); an explicit dark choice in the viewer still applies */
  :root {
    --bg: #EFF3F4;
    --surface: #FFFFFF;
    --surface-2: #F5F8F9;
    --ink: #152328;
    --muted: #55666D;
    --line: #D6E0E3;
    --accent: #0E5A6B;
    --accent-soft: #DCEEF2;
    --accent-ink: #FFFFFF;
    --ok: #23744A;
    --ok-soft: #E0F0E6;
    --warn: #8F5F00;
    --warn-soft: #FAEFD4;
    --bad: #B32317;
    --bad-soft: #FAE3E0;
    --info: #4D5E69;
    --info-soft: #E5EAEE;
    --p-ml: #eda100;
    --p-sh: #eb6834;
    --p-tt: #1baf7a;
    --p-lj: #2a78d6;
    --scan: #0C1417;
    --scan-line: #37C3D6;
    --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
    --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }

  :root[data-theme="dark"] {
    --bg: #0D1417;
    --surface: #152025;
    --surface-2: #1A262C;
    --ink: #E2EBEE;
    --muted: #92A3AB;
    --line: #263741;
    --accent: #4DB5C7;
    --accent-soft: #11313A;
    --accent-ink: #0A1417;
    --ok: #5CC387;
    --ok-soft: #17301F;
    --warn: #E5B04E;
    --warn-soft: #33290F;
    --bad: #FF7A6B;
    --bad-soft: #3A1A17;
    --info: #A8B6C1;
    --info-soft: #222D35;
    --p-ml: #c98500;
    --p-sh: #d95926;
    --p-tt: #199e70;
    --p-lj: #3987e5;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--f-body);
    margin: 0;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }

  h1 {
    font-family: var(--f-display);
    font-weight: 800;
    font-stretch: 82%;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  h2 {
    font-family: var(--f-display);
    font-weight: 700;
    font-stretch: 90%;
    font-size: 1.1rem;
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }

  p {
    margin: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .ic {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .eyebrow {
    font-family: var(--f-mono);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }

  .muted {
    color: var(--muted);
  }

  .sub {
    display: block;
    color: var(--muted);
    font-size: .84rem;
  }

  .hint {
    font-size: .84rem;
    color: var(--muted);
  }

  .mono {
    font-family: var(--f-mono);
    font-size: .88em;
  }

  .vh {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Demo strip */
  .demo-strip {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--bg);
    font-size: .76rem;
    padding: 5px 16px;
    white-space: nowrap;
  }

  .demo-strip span {
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .demo-strip button {
    flex: none;
    background: none;
    border: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 0 2px;
    cursor: pointer;
    color: inherit;
    font-size: .76rem;
  }

  /* Shell */
  .app {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    min-height: calc(100vh - 28px);
  }

  .side {
    border-right: 1px solid var(--line);
    background: var(--surface);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: start;
  }

  .brand {
    display: flex;
    gap: 10px;
    align-items: center;
    font-family: var(--f-display);
    font-weight: 800;
    font-stretch: 85%;
    font-size: 1.08rem;
    line-height: 1.1;
    padding: 4px 6px;
  }

  .brand .ic {
    width: 34px;
    height: 34px;
    padding: 6px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .brand small {
    display: block;
    font: 500 .74rem var(--f-body);
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0;
  }

  .mtop {
    display: none;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 10px;
    border: 0;
    background: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
    text-align: left;
  }

  .nav button:hover {
    color: var(--ink);
    background: var(--surface-2);
  }

  .nav button.on {
    color: var(--ink);
    background: var(--accent-soft);
  }

  .badge {
    margin-left: auto;
    font: 600 .72rem var(--f-mono);
    background: var(--bad);
    color: var(--surface);
    border-radius: 999px;
    padding: 1px 7px;
  }

  .badge.neutral {
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  .side-foot {
    margin-top: auto;
    font-size: .76rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  main {
    padding: 28px 32px 56px;
    min-width: 0;
  }

  .view {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tabbar {
    display: none;
  }

  /* Generic */
  .page-h {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    align-items: flex-end;
    justify-content: space-between;
  }

  .page-h>div {
    min-width: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }

  .card-h {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    text-align: center;
  }

  .btn:hover {
    border-color: var(--ink);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .btn-primary:hover {
    border-color: var(--accent);
    filter: brightness(1.07);
  }

  .btn.on {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .btn:disabled {
    opacity: .65;
    cursor: progress;
  }

  .btn-lg {
    min-height: 54px;
    font-size: 1.04rem;
    padding: 10px 20px;
  }

  .w100 {
    width: 100%;
  }

  .btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .linkbtn {
    background: none;
    border: 0;
    padding: 0;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    font-size: .78rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .pill-muted {
    background: var(--surface-2);
    color: var(--muted);
    border-color: var(--line);
  }

  .pill-info {
    background: var(--info-soft);
    color: var(--info);
  }

  .pill-warn {
    background: var(--warn-soft);
    color: var(--warn);
  }

  .pill-accent {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .pill-ink {
    color: var(--ink);
    border-color: var(--ink);
  }

  .pill-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }

  .pill-bad {
    background: var(--bad-soft);
    color: var(--bad);
  }

  .plat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: .86rem;
    white-space: nowrap;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }

  .p-ml {
    background: var(--p-ml);
  }

  .p-sh {
    background: var(--p-sh);
  }

  .p-tt {
    background: var(--p-tt);
  }

  .p-lj {
    background: var(--p-lj);
  }

  input[type="search"],
  input[type="text"],
  select,
  textarea {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 9px 12px;
    min-height: 46px;
    font-size: 1rem;
  }

  textarea {
    width: 100%;
    resize: vertical;
  }

  /* Guide (demo) */
  details.guide {
    border: 1.5px dashed var(--accent);
    background: var(--surface);
    border-radius: 10px;
  }

  details.guide>summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
  }

  details.guide>summary::-webkit-details-marker {
    display: none;
  }

  details.guide>summary::after {
    content: "Mostrar";
    margin-left: auto;
    font-size: .82rem;
    font-weight: 600;
    color: var(--accent);
  }

  details.guide[open]>summary::after {
    content: "Esconder";
  }

  .prog {
    width: 90px;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    overflow: hidden;
    flex: none;
  }

  .prog i {
    display: block;
    height: 100%;
    background: var(--ok);
  }

  .guide ol {
    margin: 0;
    padding: 0 16px 16px;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .gstep {
    width: 100%;
    height: 100%;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    text-align: left;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    cursor: pointer;
    font-size: .88rem;
  }

  .gstep:hover {
    border-color: var(--accent);
  }

  .gnum {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    display: grid;
    place-items: center;
    font: 600 .75rem var(--f-mono);
    color: var(--muted);
  }

  .gstep.done {
    color: var(--muted);
  }

  .gstep.done .gnum {
    background: var(--ok);
    border-color: var(--ok);
    color: var(--surface);
  }

  /* Painel: platform summary */
  .sum3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .sum {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: flex-start;
    text-align: left;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    cursor: pointer;
    min-width: 0;
  }

  .sum:hover {
    border-color: var(--ink);
  }

  .sum-n {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: 2.1rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .sum-l {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    margin-top: 6px;
  }

  .sum.ok .sum-n {
    color: var(--ok);
  }

  .sum.bad .sum-n {
    color: var(--bad);
  }

  /* Painel: tasks */
  .tgroups {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .tgroup {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tg-h {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
  }

  .tg-ic {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: grid;
    place-items: center;
  }

  .tg-ic .ic {
    width: 20px;
    height: 20px;
  }

  .tone-bad {
    background: var(--bad-soft);
    color: var(--bad);
  }

  .tone-warn {
    background: var(--warn-soft);
    color: var(--warn);
  }

  .tone-info {
    background: var(--info-soft);
    color: var(--info);
  }

  .tone-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }

  .tg-n {
    font-family: var(--f-display);
    font-weight: 800;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
  }

  .tlist {
    list-style: none;
    margin: 0 0 0 48px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .trow {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: var(--surface);
    text-align: left;
    cursor: pointer;
  }

  .tlist li:first-child .trow {
    border-top: 0;
  }

  .trow:hover {
    background: var(--surface-2);
  }

  .trow b {
    font-weight: 600;
  }

  .chev {
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
  }

  .tg-more {
    margin-left: 48px;
    align-self: flex-start;
  }

  .risk {
    margin-left: 48px;
    font-size: .86rem;
    color: var(--bad);
    font-weight: 600;
  }

  .allgood {
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--ok);
    font-weight: 600;
  }

  /* Painel: filters, KPIs, tasks tabs */
  .dfilters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .dfilters select { min-width: 0; flex: 0 1 230px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; text-align: left; }
  button.kpi { cursor: pointer; }
  button.kpi:hover { border-color: var(--ink); }
  .kpi-l { font-size: .86rem; font-weight: 600; color: var(--muted); }
  .kpi-v { font-family: var(--f-display); font-weight: 800; font-stretch: 88%; font-size: 1.9rem; line-height: 1.1; white-space: nowrap; }
  .kpi-d { display: block; font-size: .8rem; font-weight: 600; }
  .kpi-d .ic { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }
  .kpi-d .muted { font-weight: 400; }
  .d-good { color: var(--ok); } .d-bad { color: var(--bad); }
  .kpi-risk { border-color: var(--bad); background: var(--bad-soft); }
  .kpi-risk .kpi-v { color: var(--bad); }
  .dgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .ttabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .ttab { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: .88rem; min-height: 44px; }
  .ttab:hover { border-color: var(--ink); }
  .ttab[aria-selected="true"] { border-color: var(--ink); background: var(--surface-2); }
  .ttab:disabled { opacity: .45; cursor: default; }
  .ttab .tt-ic { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; }
  .ttab .tt-ic .ic { width: 17px; height: 17px; }
  .ttab b { font-family: var(--f-display); font-size: 1.05rem; }
  [role="tabpanel"] { display: flex; flex-direction: column; gap: 10px; }
  [role="tabpanel"] .tlist { margin: 0; }
  [role="tabpanel"] .risk { margin: 0; display: flex; align-items: center; gap: 6px; }
  [role="tabpanel"] .linkbtn { align-self: flex-start; }
  .pipe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pipe button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
  .pipe li:first-child button { border-top: 0; padding-top: 0; }
  .pipe button:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .pipe-n { font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; }

  /* Chart (categorical colors = platform tokens, validated: adjacency CVD ΔE ≥ 9.1 light / 8.4 dark) */
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .86rem; color: var(--muted); }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { color: var(--ink); font-weight: 600; }
  .lg-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart { position: relative; min-height: 250px; }
  .chart svg { display: block; max-width: 100%; overflow: visible; }
  .chart .gl { stroke: var(--line); stroke-width: 1; }
  .chart .base { stroke: var(--muted); stroke-width: 1; }
  .chart .ax { fill: var(--muted); font: 11px var(--f-body); font-variant-numeric: tabular-nums; }
  .chart .cap { fill: var(--ink); font: 600 11.5px var(--f-body); }
  .chart .el { fill: var(--muted); font: 11.5px var(--f-body); }
  .chart .col { transition: opacity .15s; }
  .chart.hovering .col { opacity: .4; }
  .chart.hovering .col.on { opacity: 1; }
  .chart .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
  .c-ml { fill: var(--p-ml); } .c-sh { fill: var(--p-sh); } .c-tt { fill: var(--p-tt); } .c-lj { fill: var(--p-lj); }
  .ctip { position: absolute; z-index: 3; pointer-events: none; min-width: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 10px 12px; font-size: .82rem; display: flex; flex-direction: column; gap: 4px; }
  .ct-h { font-weight: 600; margin-bottom: 2px; }
  .ct-r { display: flex; align-items: center; gap: 8px; }
  .ct-r b { min-width: 2ch; font-variant-numeric: tabular-nums; }
  .ct-k { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  .ct-t { border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; font-weight: 600; }

  /* Reasons + comparison */
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .mbars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .9rem; }
  .mb-v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .mb-t { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .mb-f { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .insight { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); font-size: .88rem; }
  .insight .ic { color: var(--warn); margin-top: 2px; }
  .tbl { overflow-x: auto; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .tbl th, .tbl td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl th { font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }

  @media (max-width: 1150px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dgrid, .duo { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .kpi { padding: 12px; }
    .kpi-v { font-size: 1.45rem; }
    .dfilters .seg { flex: 1 1 100%; }
    .dfilters .segb { flex: 1; }
    .dfilters select { flex: 1 1 100%; }
  }


  /* List */
  .filters {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .chip {
    flex: none;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: .86rem;
    cursor: pointer;
    white-space: nowrap;
    min-height: 38px;
  }

  .chip.on {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .chip-n {
    font-family: var(--f-mono);
    font-size: .74rem;
    opacity: .7;
    margin-left: 2px;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-row input {
    flex: 1 1 240px;
    min-width: 0;
  }

  .filter-row select {
    flex: 0 1 220px;
    min-width: 0;
  }

  .rows {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 140px 240px 110px;
    gap: 14px;
    align-items: center;
    padding: 12px 16px;
    background: none;
    border: 0;
    border-top: 1px solid var(--line);
    text-align: left;
    cursor: pointer;
    width: 100%;
  }

  .row:first-child {
    border-top: 0;
  }

  .row:hover {
    background: var(--surface-2);
  }

  .r-main {
    min-width: 0;
  }

  .r-main b {
    font-weight: 600;
  }

  .r-st {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    min-width: 0;
  }

  .r-next {
    font-size: .8rem;
    color: var(--muted);
  }

  .r-next.t-bad {
    color: var(--bad);
    font-weight: 600;
  }

  .r-next.t-warn {
    color: var(--warn);
    font-weight: 600;
  }

  .r-val {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .new {
    display: inline-block;
    margin-left: 6px;
    font: 600 .66rem var(--f-mono);
    text-transform: uppercase;
    letter-spacing: .06em;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 1px 6px;
    border-radius: 3px;
    vertical-align: 2px;
  }

  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
  }

  /* Ficha */
  .back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 0;
    font-weight: 600;
    align-self: flex-start;
    min-height: 36px;
  }

  .back:hover {
    color: var(--ink);
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    font-size: .9rem;
  }

  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .steps li {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    min-width: 0;
    padding: 0 2px;
  }

  .steps li::before {
    content: "";
    position: absolute;
    top: 14px;
    right: 50%;
    width: 100%;
    height: 2px;
    background: var(--line);
    z-index: 0;
  }

  .steps li:first-child::before {
    display: none;
  }

  .steps li.st-done::before,
  .steps li.st-cur::before,
  .steps li.st-skip::before {
    background: var(--ok);
  }

  .sc {
    position: relative;
    z-index: 1;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 600 .8rem var(--f-mono);
    background: var(--surface);
    border: 2px solid var(--line);
    color: var(--muted);
  }

  .sc .ic {
    width: 16px;
    height: 16px;
  }

  .st-done .sc {
    background: var(--ok);
    border-color: var(--ok);
    color: var(--surface);
  }

  .st-cur .sc {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .st-bad .sc {
    background: var(--bad);
    border-color: var(--bad);
    color: var(--surface);
  }

  .st-skip .sc {
    border-style: dashed;
    border-color: var(--ok);
    color: var(--ok);
  }

  .sl {
    font-size: .82rem;
    font-weight: 600;
    line-height: 1.2;
  }

  .st-todo .sl {
    color: var(--muted);
    font-weight: 500;
  }

  .st-cur .sl {
    color: var(--accent);
  }

  .sd {
    font-size: .72rem;
    color: var(--muted);
  }

  .next {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--surface);
  }

  .next-h {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .next-h>div {
    min-width: 0;
    flex: 1 1 260px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .next-h p.muted {
    font-size: .92rem;
  }

  .next-accent {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .next-bad {
    background: var(--bad-soft);
    border-color: var(--bad);
  }

  .next-warn {
    background: var(--warn-soft);
    border-color: var(--warn);
  }

  .next-ok {
    background: var(--ok-soft);
    border-color: var(--ok);
  }

  .dsteps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    counter-reset: ds;
  }

  .dsteps>li {
    counter-increment: ds;
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    gap: 10px 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .dsteps>li::before {
    content: counter(ds);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 600 .78rem var(--f-mono);
    border: 1.5px solid var(--ink);
  }

  .dsteps>li.wide {
    grid-template-columns: 28px minmax(0, 1fr);
  }

  .dsteps>li.wide .inrow {
    grid-column: 2;
  }

  .dsteps b {
    font-weight: 600;
  }

  .grid2 {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }

  .vols {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .vols li {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    font-size: .9rem;
  }

  .vbox {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font: 600 .76rem var(--f-mono);
    border: 1.5px dashed var(--muted);
    color: var(--muted);
  }

  .vbox.ok {
    border-style: solid;
    border-color: var(--ok);
    background: var(--ok-soft);
    color: var(--ok);
  }

  dl.kv {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 8px 14px;
    margin: 0;
    font-size: .9rem;
  }

  dl.kv dt {
    color: var(--muted);
  }

  dl.kv dd {
    margin: 0;
    min-width: 0;
  }

  .tl {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tl li {
    position: relative;
    padding: 0 0 14px 24px;
    font-size: .9rem;
  }

  .tl li::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--muted);
  }

  .tl li::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 20px;
    bottom: 0;
    width: 1.5px;
    background: var(--line);
  }

  .tl li:last-child::after {
    display: none;
  }

  .tl li:first-child::before {
    border-color: var(--accent);
    background: var(--accent);
  }

  .tl .when {
    display: block;
    font-size: .78rem;
    color: var(--muted);
  }

  /* Photos + choices */
  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }

  .ph {
    position: relative;
    margin: 0;
    aspect-ratio: 4 / 3;
    max-width: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-2);
  }

  .ph img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ph figcaption {
    position: absolute;
    left: 6px;
    top: 6px;
    font: 600 .68rem var(--f-mono);
    background: rgba(0, 0, 0, .62);
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
  }

  .ph-x {
    position: absolute;
    right: 4px;
    top: 4px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0;
    background: rgba(0, 0, 0, .62);
    color: #fff;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
  }

  .addph {
    aspect-ratio: 4 / 3;
    max-width: 100%;
    border: 1.5px dashed var(--muted);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    background: none;
    color: var(--ink);
    font-weight: 600;
    font-size: .85rem;
    text-align: center;
    padding: 6px;
    position: relative;
  }

  .addph.main {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }

  .addph:hover,
  .addph:focus-within {
    border-color: var(--accent);
    color: var(--accent);
  }

  .addph .ic {
    width: 24px;
    height: 24px;
  }

  .big2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .bigc {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
  }

  .bigc .ic {
    width: 30px;
    height: 30px;
  }

  .bigc small {
    font-weight: 400;
    color: var(--muted);
    font-size: .8rem;
  }

  .bigc.ok .ic {
    color: var(--ok);
  }

  .bigc.bad .ic {
    color: var(--bad);
  }

  .bigc:hover {
    border-color: var(--ink);
  }

  .bigc.ok.on {
    border-color: var(--ok);
    background: var(--ok-soft);
  }

  .bigc.bad.on {
    border-color: var(--bad);
    background: var(--bad-soft);
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .choice {
    position: relative;
  }

  .choice input {
    position: absolute;
    opacity: 0;
    inset: 0;
    cursor: pointer;
    margin: 0;
  }

  .choice span {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-weight: 600;
    font-size: .92rem;
    background: var(--surface);
  }

  .choice input:checked+span {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .choice input:focus-visible+span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .seg {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .segb {
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
  }

  .segb.on {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .qnum {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    font: 600 .75rem var(--f-mono);
    margin-right: 8px;
    vertical-align: 2px;
  }

  .err {
    color: var(--bad);
    font-weight: 600;
  }

  .sticky-actions {
    position: sticky;
    bottom: 0;
    padding: 12px 0 4px;
    background: linear-gradient(to bottom, transparent, var(--bg) 35%);
    z-index: 5;
  }

  .inrow {
    display: flex;
    gap: 8px;
  }

  .inrow input {
    flex: 1;
    min-width: 0;
  }

  .inrow.code input {
    font-family: var(--f-mono);
    letter-spacing: .04em;
  }

  /* Receber */
  .recv {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .recv-main,
  .recv-side {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }

  .viewfinder {
    position: relative;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--scan);
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .vf-label {
    width: 44%;
    aspect-ratio: 2.2 / 1;
    background: #EDEDE8;
    border-radius: 3px;
    padding: 6% 7%;
    display: flex;
    flex-direction: column;
    gap: 6%;
    opacity: .45;
    transform: rotate(-3deg);
  }

  .vf-bars {
    flex: 1;
    background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 5px, transparent 5px 8px, #111 8px 11px, transparent 11px 12px);
  }

  .vf-num {
    height: 12%;
    background: repeating-linear-gradient(90deg, #555 0 5px, transparent 5px 7px);
  }

  .scanning .vf-label {
    opacity: .95;
  }

  .vf-frame {
    position: absolute;
    inset: 14% 18%;
    border: 2px solid rgba(255, 255, 255, .22);
    border-radius: 8px;
  }

  .vf-line {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 50%;
    height: 2px;
    background: var(--scan-line);
    box-shadow: 0 0 14px var(--scan-line);
    opacity: .3;
  }

  .scanning .vf-line {
    opacity: 1;
    animation: sweep 1s ease-in-out infinite alternate;
  }

  @keyframes sweep {
    from {
      top: 18%;
    }

    to {
      top: 82%;
    }
  }

  .vf-txt {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, .75);
    font: 500 .74rem var(--f-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .lbl {
    font-size: .88rem;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }

  .result {
    border-radius: 10px;
    padding: 16px;
    border: 2px solid;
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: pop .25s ease-out;
  }

  @keyframes pop {
    from {
      transform: scale(.985);
    }

    to {
      transform: none;
    }
  }

  .res-ok {
    background: var(--ok-soft);
    border-color: var(--ok);
  }

  .res-warn {
    background: var(--warn-soft);
    border-color: var(--warn);
  }

  .res-bad {
    background: var(--bad-soft);
    border-color: var(--bad);
  }

  .res-h {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .res-ok .res-h {
    color: var(--ok);
  }

  .res-warn .res-h {
    color: var(--warn);
  }

  .res-bad .res-h {
    color: var(--bad);
  }

  .res-h .mono {
    margin-left: auto;
    color: var(--muted);
    font-weight: 500;
    font-size: .8rem;
  }

  .res-h .ic {
    width: 24px;
    height: 24px;
  }

  .res-prod {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 1.3rem;
    font-stretch: 90%;
  }

  .res-vol {
    font-weight: 600;
  }

  .res-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .res-btns .btn {
    flex: 1 1 180px;
  }

  details.tests>summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  details.tests>summary::-webkit-details-marker {
    display: none;
  }

  details.tests>summary::after {
    content: "+";
    font-family: var(--f-mono);
    color: var(--muted);
  }

  details.tests[open]>summary::after {
    content: "–";
  }

  .codes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  .code-b {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    min-height: 44px;
  }

  .code-b:hover {
    border-color: var(--ink);
  }

  .code-b .mono {
    font-weight: 600;
  }

  .code-b small {
    color: var(--muted);
    font-size: .78rem;
    text-align: right;
    min-width: 0;
  }

  .today {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: .88rem;
  }

  .today li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 24px;
    background: var(--ink);
    color: var(--bg);
    padding: 11px 16px;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 500;
    width: max-content;
    max-width: calc(100% - 32px);
    z-index: 30;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .2);
  }

  .spin {
    width: 16px;
    height: 16px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: rot .8s linear infinite;
    display: inline-block;
  }

  @keyframes rot {
    to {
      transform: rotate(360deg);
    }
  }

  @media (max-width: 1150px) {
    .grid2 {
      grid-template-columns: minmax(0, 1fr);
    }

    .guide ol {

            '<div class="btns"><button type="button" class="btn' + (f === 'ganha' ? ' on' : '') + '" data-act="res" data-r="ganha">' + icon('checkc') + ' Ganhamos</button><button type="button" class="btn' + (f === 'perdida' ? ' on' : '') + '" data-act="res" data-r="perdida">' + icon('x') + ' Perdemos</button></div>';

          if (f === 'perdida') out += '<form id="resForm" data-r="perdida" class="inrow" autocomplete="off"><label class="vh" for="fMot">Motivo</label><input type="text" id="fMot" placeholder="Motivo. Ex.: fotos não aceitas"><button class="btn btn-primary" type="submit">Salvar</button></form>';

    /* ---------- Conferência (inspeção) ---------- */
    function photosEdit() {
      var d = S.draft;
      return d.fotos.map(function (f, i) {
        return '<figure class="ph"><img src="' + fotoSrc(f) + '" alt="Foto ' + (i + 1) + ', volume ' + f.vol + '"><figcaption>Vol ' + f.vol + '</figcaption><button type="button" class="ph-x" data-act="rmFoto" data-i="' + i + '" aria-label="Remover foto ' + (i + 1) + '">×</button></figure>';
      }).join('') +
        '<label class="addph main" for="fileIn"><input type="file" id="fileIn" class="vh" accept="image/*" capture="environment" multiple>' + icon('camera') + '<span>Tirar foto</span></label>' +

      var q = 0;
      var html = '<div class="view"><button type="button" class="back" data-act="cancelInsp">' + icon('back') + ' Cancelar</button>';

          return '<button type="button" class="segb' + (d.vol === v.n ? ' on' : '') + '" data-act="vol" data-n="' + v.n + '" aria-pressed="' + (d.vol === v.n) + '">Volume ' + v.n + ' de ' + r.volumes.length + '</button>';
        }).join('') + '</div>' + (rec.length < r.volumes.length ? '<p class="hint">Os volumes que ainda não chegaram são conferidos depois.</p>' : '') + '</section>';

        '<button type="button" class="bigc bad' + (d.estado === 'problema' ? ' on' : '') + '" data-act="estado" data-e="problema" aria-pressed="' + (d.estado === 'problema') + '">' + icon('warn') + 'Com problema<small>Vai para disputa</small></button></div>';
      if (d.estado === 'problema') {
        html += '<p class="lbl" style="margin:4px 0 0">Qual é o problema?</p><div class="choices" role="radiogroup" aria-label="Qual é o problema">' + PROBLEMAS.map(function (k) {
          return '<label class="choice"><input type="radio" name="cond" value="' + k + '"' + (d.cond === k ? ' checked' : '') + '><span>' + COND[k] + '</span></label>';
        }).join('') + '</div>';
      }
      html += '</section>';
      var need = d.estado === 'problema';
      html += '<section class="card"><div class="card-h"><h2><span class="qnum">' + (++q) + '</span>Fotos' + (need ? '' : ' <span class="muted" style="font-weight:500">(opcional)</span>') + '</h2><span class="muted" id="phCount">' + plural(d.fotos.length, 'foto', 'fotos') + '</span></div>' +
        (need ? '<p class="hint">Fotografe o defeito de perto e o produto inteiro. Quanto mais fotos, mais chance de ganhar a disputa.</p>' : '') +
        '<div class="photos" id="photos">' + photosEdit() + '</div></section>';
      html += '<section class="card"><h2><label for="obs"><span class="qnum">' + (++q) + '</span>Observação <span class="muted" style="font-weight:500">(opcional)</span></label></h2><textarea id="obs" rows="3" placeholder="Ex.: porta rachada, quina quebrada">' + esc(d.obs) + '</textarea></section>';
      html += '<p class="err" id="inspErr" role="alert" hidden></p>';
      html += '<div class="sticky-actions"><button type="button" class="btn btn-primary btn-lg w100" data-act="saveInsp">' + icon('check') + ' Salvar conferência</button></div>';
      return html + '</div>';
    }
    function refreshPhotos() { $('#photos').innerHTML = photosEdit(); $('#phCount').textContent = plural(S.draft.fotos.length, 'foto', 'fotos'); var e = $('#inspErr'); if (e) e.hidden = true; }
    function startInsp(id, vol) {
      var r = byId(id); if (!r) return;
      var rec = r.volumes.filter(function (v) { return v.recebidoEm; });
      S.draft = {
        id: id, estado: r.condicao ? (r.condicao === 'ok' ? 'ok' : 'problema') : null, cond: r.condicao && r.condicao !== 'ok' ? r.condicao : null, obs: r.obs, fotos: r.fotos.slice(),
        vol: vol || (rec.length ? rec[rec.length - 1].n : 1), from: S.view
      };
      S.id = id; go('insp');
    }
    function saveInsp() {
      var d = S.draft, r = byId(d.id), err = $('#inspErr');
      var fail = function (m) { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: 'center' }); };
      if (!d.estado) return fail('Escolha como o produto chegou: em bom estado ou com problema.');
      if (d.estado === 'problema' && !d.cond) return fail('Escolha qual é o problema.');
      if (d.estado === 'problema' && !d.fotos.length) return fail('Tire pelo menos 1 foto. Ela é a prova da disputa.');
      r.condicao = d.estado === 'ok' ? 'ok' : d.cond; r.obs = d.obs.trim(); r.fotos = d.fotos.slice(); r.inspecionadaEm = Date.now();
      r.timeline.push({ t: Date.now(), txt: 'Conferido: ' + COND[r.condicao] + (r.fotos.length ? ' · ' + plural(r.fotos.length, 'foto', 'fotos') : ''), por: VOCE });
      var from = d.from; S.draft = null;
      if (from === 'receber') { S.scan = null; go('receber'); toast('Conferência salva. Pode bipar o próximo pacote.'); }
      else { S.id = r.id; go('ficha'); toast(r.condicao === 'ok' ? 'Conferência salva.' : 'Conferência salva. Agora é só abrir a disputa.'); }
    }

    /* ---------- Receber ---------- */
    var CAM_ORDER = ['DV-1052', 'DV-1049', 'DV-1050', 'DV-1051', 'DV-1047'];
    function pendingVols() {
      var out = [];
      DB.forEach(function (r) {
        var k = status(r).k;
        if (k !== 'aguardando' && k !== 'parcial') return;
        r.volumes.forEach(function (v) { if (!v.recebidoEm) out.push({ r: r, v: v }); });
      });
      out.sort(function (a, b) {
        var ia = CAM_ORDER.indexOf(a.r.id), ib = CAM_ORDER.indexOf(b.r.id);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.v.n - b.v.n;
      });
      return out;
    }
    function scanResultHtml() {
      var sc = S.scan; if (!sc) return '';
      if (sc.tipo === 'nf') {
        return '<div class="result res-bad" role="alert"><div class="res-h">' + icon('x') + '<span>Código não encontrado</span><span class="mono">' + esc(sc.codigo) + '</span></div>' +

          '<form id="pedForm" class="inrow" autocomplete="off"><label class="vh" for="pedIn">Número do pedido</label><input type="text" id="pedIn" placeholder="Nº do pedido"><button class="btn" type="submit">Procurar</button></form>' +
          '<p class="hint">Não achou? Registre o pacote e a gestão vincula depois.</p>' +
          '<div class="res-btns"><button type="button" class="btn" data-act="naoId">Registrar como não identificado</button></div></div>';
      }
      var r = byId(sc.id), v = r.volumes[sc.vol - 1], n = r.volumes.length;

      if (sc.tipo === 'dup') {
        return '<div class="result res-warn" role="alert"><div class="res-h">' + icon('warn') + '<span>Este volume já foi recebido</span><span class="mono">' + esc(sc.codigo) + '</span></div>' + head +
          '<p class="res-vol">Volume ' + v.n + ' de ' + n + ' · recebido ' + quando(v.recebidoEm) + ' por ' + esc(v.por) + '</p><p class="hint">Nada foi registrado de novo.</p>' +
          '<div class="res-btns"><button type="button" class="btn btn-primary" data-act="nextScan">' + icon('scan') + ' Bipar outro pacote</button><button type="button" class="btn" data-act="open" data-id="' + r.id + '">Ver devolução</button></div></div>';
      }

          '<p>O pacote chegou, mas a plataforma não aprovou a devolução. Registrar a chegada mesmo assim?</p>' +
          '<div class="res-btns"><button type="button" class="btn btn-primary" data-act="forceRecv">Sim, registrar chegada</button><button type="button" class="btn" data-act="nextScan">Não, cancelar</button></div></div>';
      }

      return '<div class="result res-ok" role="status"><div class="res-h">' + icon('checkc') + '<span>Chegada registrada</span><span class="mono">' + esc(sc.codigo) + '</span></div>' + head +
        '<p class="res-vol">Volume ' + v.n + ' de ' + n + (faltam ? ' · ' + (faltam === 1 ? 'ainda falta 1 volume' : 'ainda faltam ' + faltam + ' volumes') : ' · todos os volumes chegaram') + '</p>' +
        '<div class="res-btns"><button type="button" class="btn btn-primary btn-lg" data-act="gotoInsp" data-id="' + r.id + '" data-vol="' + v.n + '">' + icon('camera') + ' Conferir e fotografar agora</button><button type="button" class="btn btn-lg" data-act="nextScan">' + icon('scan') + ' Bipar outro pacote</button></div></div>';
    }
    function vReceber() {
      var pend = pendingVols();
      var tests = pend.slice(0, 5).map(function (x) { return [x.v.codigo, x.r.produto + ' · vol ' + x.v.n + '/' + x.r.volumes.length]; });
      var dupR = DB.filter(function (r) { return status(r).k === 'recebida'; })[0];
      if (dupR) tests.push([dupR.volumes[0].codigo, 'já recebido']);
      var recR = byId('DV-1035'); if (recR && !recR.volumes[0].recebidoEm) tests.push([recR.volumes[0].codigo, 'devolução recusada']);
      tests.push(['BR26999901', 'código desconhecido']);
      var hoje = [];
      DB.forEach(function (r) { r.volumes.forEach(function (v) { if (v.recebidoEm && daysSince(v.recebidoEm) === 0) hoje.push({ r: r, v: v }); }); });
      hoje.sort(function (a, b) { return b.v.recebidoEm - a.v.recebidoEm; });

      var html = '<div class="view"><div class="page-h"><div><h1>Receber pacote</h1><p class="muted" style="margin-top:4px">Chegou uma devolução? Leia a etiqueta para registrar a chegada.</p></div></div>';
      html += '<div class="recv"><div class="recv-main">';
      if (S.scan) html += '<div id="scanResult">' + scanResultHtml() + '</div>';
      html += '<section class="card">';
      html += '<div class="viewfinder' + (S.scanning ? ' scanning' : '') + '"><div class="vf-label" aria-hidden="true"><div class="vf-bars"></div><div class="vf-num"></div></div><span class="vf-frame"></span><span class="vf-line"></span><span class="vf-txt">' + (S.scanning ? 'Lendo etiqueta…' : 'Aponte para o código de barras') + '</span></div>';
      html += '<button type="button" class="btn btn-primary btn-lg w100" data-act="camSim"' + (S.scanning ? ' disabled' : '') + '>' + icon('scan') + ' Ler etiqueta com a câmera</button>';
      html += '<p class="hint">Na demonstração, a leitura pela câmera é simulada.</p>';
      html += '<form id="scanForm" autocomplete="off"><label class="lbl" for="scanIn">Ou use o leitor de código de barras / digite o código</label><div class="inrow code"><input type="text" id="scanIn" placeholder="BR26…" autocapitalize="characters" spellcheck="false"><button class="btn" type="submit">Registrar</button></div></form>';
      html += '</section></div><aside class="recv-side">';
      html += '<section class="card"><div class="card-h"><h2>Chegaram hoje</h2><span class="hint">' + plural(pend.length, 'volume a caminho', 'volumes a caminho') + '</span></div>' + (hoje.length ? '<ul class="today">' + hoje.map(function (x) {
        return '<li><span>' + esc(x.r.produto) + ' <span class="muted">· vol ' + x.v.n + '/' + x.r.volumes.length + '</span></span><span class="muted">' + hhmm(x.v.recebidoEm) + '</span></li>';
      }).join('') + '</ul>' : '<p class="muted">Nenhum pacote recebido hoje ainda.</p>') + '</section>';
      html += '<section class="card"><details class="tests"' + (wide() ? ' open' : '') + '><summary>Códigos para testar a demonstração</summary><div class="codes">' + tests.map(function (t) {
        return '<button type="button" class="code-b" data-act="test" data-code="' + t[0] + '"><span class="mono">' + t[0] + '</span><small>' + esc(t[1]) + '</small></button>';
      }).join('') + '</div></details></section>';
      html += '</aside></div></div>';
      return html;
    }
    function receber(r, v) {
      v.recebidoEm = Date.now(); v.por = VOCE;
      r.timeline.push({ t: Date.now(), txt: 'Volume ' + v.n + ' de ' + r.volumes.length + ' chegou (bipado)', por: VOCE });
      S.done.scan = true;
    }
    function processCode(code) {
      code = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!code) return;
      var hit = null;
      DB.forEach(function (r) { r.volumes.forEach(function (v) { if (v.codigo === code) hit = { r: r, v: v }; }); });
      if (!hit) { S.scan = { tipo: 'nf', codigo: code }; beep(false); }
      else if (hit.v.recebidoEm) { S.scan = { tipo: 'dup', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(false); }
      else if (hit.r.statusPlat !== 'aprovada') { S.scan = { tipo: 'confirm', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(false); }
      else { receber(hit.r, hit.v); S.scan = { tipo: 'ok', id: hit.r.id, vol: hit.v.n, codigo: code }; beep(true); }
      render(); window.scrollTo(0, 0);
    }
    function camSim() {
      var p = pendingVols();
      if (!p.length) { toast('Não há pacotes a caminho.'); return; }
      S.scanning = true; S.scan = null; render();
      setTimeout(function () { S.scanning = false; processCode(p[0].v.codigo); }, 1300);
    }

    /* ---------- sound + toast ---------- */
    var actx = null;
    function beep(ok) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = ok ? 1760 : 220; g.gain.value = 0.04;
        o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.3));
      } catch (e) { /* som opcional */ }
    }
    var tTimer;
    function toast(m) { var el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(tTimer); tTimer = setTimeout(function () { el.hidden = true; }, 3800); }

    /* ---------- sync ---------- */
    function doSync() {
      if (S.syncing) return;
      S.syncing = true; if (S.view !== 'painel') go('painel'); else render();
      setTimeout(function () {
        S.syncing = false; var msg;
        if (!S.synced) {
          newOnes().forEach(function (o) { DB.push(build(o)); });
          var r = byId('DV-1053');
          if (r && r.statusPlat === 'analise') { r.statusPlat = 'aprovada'; r.aprovadaEm = Date.now(); r.novo = true; r.timeline.push({ t: Date.now(), txt: 'Aprovada pela plataforma', por: PLATF }); }
          S.synced = true; msg = 'Pronto: 3 devoluções novas e 1 aprovada desde ontem.';
        } else msg = 'Tudo em dia. Nenhuma novidade nas plataformas.';
        S.lastSync = Date.now(); S.done.sync = true; render(); toast(msg);
      }, 1500);
    }

    /* ---------- render + routing ---------- */
    var root = 'painel';
    function render() {
      var v = S.view, m = $('#main');
      m.innerHTML = v === 'painel' ? vPainel() : v === 'lista' ? vLista() : v === 'receber' ? vReceber() : v === 'ficha' ? vFicha() : vInsp();
      if (v === 'painel') drawChart();
      var navKey = root;
      document.querySelectorAll('[data-nav]').forEach(function (b) { var on = b.dataset.nav === navKey; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
      var nT = nTasks(), nPend = pendingVols().length;
      document.querySelectorAll('[data-badge="painel"]').forEach(function (b) { b.textContent = nT; b.hidden = !nT; });
      document.querySelectorAll('[data-badge="receber"]').forEach(function (b) { b.textContent = nPend; b.hidden = !nPend; });
      if (v === 'receber' && !S.scanning && !S.scan && window.matchMedia && matchMedia('(pointer: fine)').matches) { var i = $('#scanIn'); if (i) i.focus({ preventScroll: true }); }
    }
    function go(v) {
      if (v === 'painel' || v === 'lista' || v === 'receber') root = v;
      S.view = v; S.form = null; S.txtFallback = null; render(); window.scrollTo(0, 0);
    }
    function goBack() {
      S.view = root; S.form = null; S.txtFallback = null; render(); window.scrollTo(0, 0);
    }
    function openFicha(id) { S.id = id; S.done.ficha = true; var r = byId(id); if (r) r.novo = false; go('ficha'); }

    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var a = b.dataset.act, id = b.dataset.id, r, g;
      switch (a) {
        case 'nav': if (b.dataset.v === 'receber' && S.view !== 'receber') S.scan = null; go(b.dataset.v); break;
        case 'back': goBack(); break;
        case 'open': openFicha(id); break;
        case 'filter': S.filtro = b.dataset.f; S.q = ''; S.plat = S.view === 'painel' ? S.dplat : ''; if (S.view === 'lista') render(); else go('lista'); break;
        case 'sync': doSync(); break;
        case 'per': S.per = +b.dataset.p; render(); break;
        case 'ttab': S.ttab = b.dataset.t; render(); var tb = document.querySelector('.ttab[data-t="' + S.ttab + '"]'); if (tb) tb.focus(); break;
        case 'chartTable': S.chartTable = !S.chartTable; render(); break;
        case 'reset': reset(); go('painel'); toast('Demonstração reiniciada.'); break;
        case 'g1': doSync(); break;
        case 'g2': g = tasks(); r = g.disputa[0] || g.conferir[0] || DB[0]; openFicha(r.id); break;
        case 'g3': S.scan = null; go('receber'); break;
        case 'g4': g = tasks(); r = g.disputa[0]; if (r) openFicha(r.id); else toast('Nenhuma devolução pronta para disputa agora.'); break;
        case 'camSim': camSim(); break;
        case 'test': processCode(b.dataset.code); break;
        case 'forceRecv': r = byId(S.scan.id); receber(r, r.volumes[S.scan.vol - 1]); S.scan.tipo = 'ok'; beep(true); render(); break;
        case 'nextScan': S.scan = null; render(); window.scrollTo(0, 0); var si = $('#scanIn'); if (si && matchMedia('(pointer: fine)').matches) si.focus(); break;
        case 'naoId': S.naoId.push({ codigo: S.scan.codigo, em: Date.now() }); S.scan = null; render(); toast('Pacote registrado. Ele aparece no painel para a gestão vincular.'); break;
        case 'gotoInsp': startInsp(id, b.dataset.vol ? +b.dataset.vol : null); break;
        case 'cancelInsp': var from = S.draft && S.draft.from; S.draft = null; if (from === 'receber') go('receber'); else { S.view = 'ficha'; render(); window.scrollTo(0, 0); } break;
        case 'vol': S.draft.vol = +b.dataset.n; render(); break;
        case 'estado': S.draft.estado = b.dataset.e; if (b.dataset.e === 'ok') S.draft.cond = null; render(); var er = $('#inspErr'); if (er) er.hidden = true; break;
        case 'exFoto': S.draft.fotos.push({ ex: true, seed: Math.floor(Math.random() * 1e6), vol: S.draft.vol }); refreshPhotos(); break;
        case 'rmFoto': S.draft.fotos.splice(+b.dataset.i, 1); refreshPhotos(); break;
        case 'saveInsp': saveInsp(); break;
        case 'res': S.form = S.form === b.dataset.r ? null : b.dataset.r; render(); var fi = document.querySelector('#resForm input'); if (fi) fi.focus(); break;
        case 'estoque':
          r = byId(id); r.estoque = true; r.encerradaEm = Date.now();
          r.timeline.push({ t: Date.now(), txt: 'Voltou ao estoque · devolução encerrada', por: VOCE }); render(); toast('Devolução encerrada. Produto de volta ao estoque.'); break;
        case 'zip':
          r = byId(id); toast('No sistema de verdade, baixa as ' + r.fotos.length + ' fotos de uma vez (' + r.id + '-fotos.zip).'); break;
        case 'copyTxt':
          r = byId(id);
          var txt = dispText(r);
          var fail = function () { S.txtFallback = id; render(); var t = $('#txtFb'); if (t) { t.focus(); t.select(); } toast('Selecione e copie o texto que apareceu.'); };
          try { navigator.clipboard.writeText(txt).then(function () { toast('Texto copiado. É só colar no site da plataforma.'); }, fail); } catch (err) { fail(); }
          break;
      }
    });

    document.addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, r;
      if (f.id === 'scanForm') { var i = $('#scanIn'); var c = i.value; i.value = ''; processCode(c); }
      else if (f.id === 'pedForm') {
        var q = $('#pedIn').value.trim().replace('#', '');
        var hit = q && DB.filter(function (x) { return x.pedido.replace('#', '').indexOf(q) >= 0; })[0];
        if (hit) { S.scan = null; openFicha(hit.id); } else toast('Nenhum pedido encontrado com esse número.');
      }
      else if (f.id === 'dispForm') {
        r = byId(S.id);
        var inp = $('#fProt'), prot = inp.value.trim();
        if (!prot) { inp.focus(); toast('Digite o número do protocolo que a plataforma mostrou.'); return; }
        r.disputa = { abertaEm: Date.now(), protocolo: prot, valor: r.valor, resultado: null, valorRecebido: 0, motivoPerda: '', fechadaEm: null };
        r.timeline.push({ t: Date.now(), txt: 'Disputa aberta · protocolo ' + prot, por: VOCE });
        S.form = null; S.txtFallback = null; S.done.disp = true; render(); window.scrollTo(0, 0); toast('Disputa registrada. Agora é aguardar a resposta da plataforma.');
      }
      else if (f.id === 'resForm') {
        r = byId(S.id);
        var res = f.dataset.r, D = r.disputa;
        D.resultado = res; D.fechadaEm = Date.now();
        if (res === 'ganha') { D.valorRecebido = parseValor($('#fRec').value) || D.valor; r.timeline.push({ t: Date.now(), txt: 'Disputa ganha · reembolso de ' + money(D.valorRecebido), por: VOCE }); }
        else { D.motivoPerda = $('#fMot').value.trim() || 'Motivo não informado'; r.timeline.push({ t: Date.now(), txt: 'Disputa perdida · ' + D.motivoPerda, por: VOCE }); }
        S.form = null; render(); toast(res === 'ganha' ? 'Reembolso registrado.' : 'Resultado registrado.');
      }
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.id === 'q') { S.q = t.value; $('#rows').innerHTML = rowsHtml(); }
      else if (t.id === 'obs' && S.draft) S.draft.obs = t.value;
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'dplat') { S.dplat = t.value; S.ttab = null; render(); return; }
      if (t.id === 'pf') { S.plat = t.value; $('#rows').innerHTML = rowsHtml(); }
      else if (t.name === 'cond' && S.draft) { S.draft.cond = t.value; var er = $('#inspErr'); if (er) er.hidden = true; }
      else if (t.id === 'fileIn' && S.draft) {
        Array.prototype.forEach.call(t.files || [], function (file) { S.draft.fotos.push({ src: URL.createObjectURL(file), vol: S.draft.vol }); });
        refreshPhotos();
      }
    });
    document.addEventListener('toggle', function (e) { if (e.target.id === 'guide') S.guideOpen = e.target.open; }, true);

    var rzT;
    window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(function () { if (S.view === 'painel' && !S.chartTable) drawChart(); }, 150); });

    document.querySelectorAll('[data-ic]').forEach(function (el) { el.insertAdjacentHTML('afterbegin', icon(el.dataset.ic)); });
    reset();
    render();
  })();
</script>
